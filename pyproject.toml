[project]
name = "kicad-lib"
version = "0.1.0"
description = "library management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kiutils>=1.4.8",
]

[project.scripts]
kicad-lib = "kicad_lib:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
